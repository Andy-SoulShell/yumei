name: yumei-tests

services:
  db:
    image: mysql:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEST_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: yumei_test
      MYSQL_USER: yumei_test
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:?set TEST_MYSQL_PASSWORD in .env.test.local}
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:?set TEST_MYSQL_ROOT_PASSWORD in .env.test.local}
    volumes:
      - mysql-test-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user=yumei_test --database=yumei_test --execute="SELECT 1" --silent'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  mysql-test-data:
