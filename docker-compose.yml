name: yumei

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://yumei:${MYSQL_PASSWORD:-devpass}@db:3306/yumei
      # Public URL of this deployment (magic links + file URLs).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Secrets — generate two DIFFERENT values with: openssl rand -hex 32
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:?set KEY_ENCRYPTION_KEY in .env}
      # Email (magic-link sign-in). Resend by default; see .env.example
      # for the SMTP alternative.
      EMAIL_FROM: ${EMAIL_FROM:-YUMEI <noreply@example.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Storage: local volume by default; switch to s3 via .env.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/data/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      # Billing: free (caps, default) | none (self-host, unlocked) | lemonsqueezy
      BILLING_PROVIDER: ${BILLING_PROVIDER:-free}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_CHECKOUT_PLUS: ${LEMONSQUEEZY_CHECKOUT_PLUS:-}
      LEMONSQUEEZY_CHECKOUT_PRO: ${LEMONSQUEEZY_CHECKOUT_PRO:-}
      LEMONSQUEEZY_VARIANT_PLUS: ${LEMONSQUEEZY_VARIANT_PLUS:-}
      LEMONSQUEEZY_VARIANT_PRO: ${LEMONSQUEEZY_VARIANT_PRO:-}
      # Web Push (optional; npx web-push generate-vapid-keys)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FAL_COUPLE_MODEL: ${FAL_COUPLE_MODEL:-}
      # Operator image generation service (fal or self-hosted ComfyUI).
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-fal}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      COMFYUI_API_KEY: ${COMFYUI_API_KEY:-}
      COMFYUI_TIMEOUT_MS: ${COMFYUI_TIMEOUT_MS:-600000}
      # Operator AI keys (users on the free tier ride on these).
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPERATOR_CHAT_BASE_URL: ${OPERATOR_CHAT_BASE_URL:-}
      COMPANION_MEMORY_ENABLED: ${COMPANION_MEMORY_ENABLED:-1}
      COMPANION_PROACTIVE_ENABLED: ${COMPANION_PROACTIVE_ENABLED:-1}
      MEMORY_EXTRACTION_MODEL: ${MEMORY_EXTRACTION_MODEL:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      AI_DAILY_TASK_LIMIT: ${AI_DAILY_TASK_LIMIT:-200}
      AI_TASK_TIMEOUT_MS: ${AI_TASK_TIMEOUT_MS:-30000}
      CHAT_CONTEXT_CHAR_LIMIT: ${CHAT_CONTEXT_CHAR_LIMIT:-80000}
      CHAT_MAX_OUTPUT_CHARS: ${CHAT_MAX_OUTPUT_CHARS:-16000}
      CHAT_REPLY_TIMEOUT_MS: ${CHAT_REPLY_TIMEOUT_MS:-120000}
      CHAT_STREAM_CONCURRENCY: ${CHAT_STREAM_CONCURRENCY:-4}
      CHAT_USER_CONCURRENCY: ${CHAT_USER_CONCURRENCY:-3}
      PROACTIVE_TICK_MS: ${PROACTIVE_TICK_MS:-60000}
      PROACTIVE_PUSH_TIMEOUT_MS: ${PROACTIVE_PUSH_TIMEOUT_MS:-8000}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      OPERATOR_DEEPSEEK_KEY: ${OPERATOR_DEEPSEEK_KEY:-}
      OPERATOR_OPENROUTER_KEY: ${OPERATOR_OPENROUTER_KEY:-}
      OPERATOR_FAL_KEY: ${OPERATOR_FAL_KEY:-}
      OPERATOR_OPENAI_KEY: ${OPERATOR_OPENAI_KEY:-}
      OPERATOR_ELEVENLABS_KEY: ${OPERATOR_ELEVENLABS_KEY:-}
      OPERATOR_FISH_AUDIO_KEY: ${OPERATOR_FISH_AUDIO_KEY:-}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yumei
      MYSQL_USER: yumei
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpass-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uploads:
  mysql-data:
